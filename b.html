<style>
body {
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#8B0000,#FF4C4C);
overflow:hidden;
}

.envelope {
width:220px;
height:300px;
background:#c40000;
border-radius:12px;
position:relative;
cursor:pointer;
}

/* 👉 貼在這裡！ */
.envelope::after {
content:"";
width:120px;
height:120px;
background:url("packet.png");
background-size:contain;
background-repeat:no-repeat;
background-position:center;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

.coin {
position:absolute;
font-size:24px;
animation:fall 2s linear infinite;
}

@keyframes fall {
from {transform:translateY(-100px);}
to {transform:translateY(800px);}
}
</style>
