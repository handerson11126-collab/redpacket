<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lucky Money</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#8B0000,#FF4C4C);
overflow:hidden;
}

.envelope{
width:1040px;
height:1400px;
background:#c40000;
border-radius:12px;
position:relative;
cursor:pointer;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

/* 中間紅包圖片 */
.envelope::after{
content:"";
width:1000px;
height:1000px;
background:url("1000058133-removebg-preview.png");
background-size:contain;
background-repeat:no-repeat;
background-position:center;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

/* 英鎊掉落特效 */
.coin{
position:absolute;
font-size:40px;
animation:fall 2s linear infinite;
}

@keyframes fall{
from{transform:translateY(-100px);}
to{transform:translateY(800px);}
}
</style>
</head>

<body>

<div class="envelope" onclick="openMoney()"></div>

<script>
function openMoney(){
window.location.href="https://revolut.me/p/c3IGB4jzJs";
}

for(let i=0;i<30;i++){
let coin=document.createElement("div");
coin.className="coin";
coin.innerHTML="💷";
coin.style.left=Math.random()*100+"vw";
coin.style.animationDuration=(Math.random()*2+1)+"s";
document.body.appendChild(coin);
}
</script>

</body>
</html>
